# Environment for every rule except the ESM2 embedding.
#
# Snakemake materialises this per-rule with `--use-conda`; it is also usable
# directly (`conda env create -f workflow/envs/soyglobin.yaml`) and replaces the
# repo-root environment.yml, which was unpinned for the Python packages and
# described the ESM2 environment only in a comment.
#
# Pins are exact because the manifests record tool versions as evidence: an
# unpinned solve means the recorded version and the committed numbers can drift
# apart without anything saying so. The three command-line tools were pinned
# before; numpy/pandas/scipy/biopython were not, and they affect the numbers.
#
# tmtools is not on conda-forge, which is why this file has a pip section and
# the solve is two-stage.
name: soyglobin
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # --- command-line tools -------------------------------------------------- #
  - hmmer=3.4
  - mafft=7.526
  # Bioconda's `iqtree` currently resolves to v3, installed as `iqtree` rather
  # than `iqtree2`. The v2 flags used here are accepted unchanged by v3, and
  # core.iqtree_exe() handles both binary names.
  - iqtree=3.1.3
  # --- analysis ------------------------------------------------------------ #
  - numpy=2.4.6
  - pandas=3.0.6
  - scipy=1.17.1
  - biopython=1.88
  - requests=2.34.2
  - pyyaml=6.0.3
  # matplotlib-base rather than matplotlib: no Qt/Tk backend is needed, every
  # figure is written straight to PNG.
  - matplotlib-base=3.11.2
  # --- workflow and tests -------------------------------------------------- #
  - snakemake-minimal=9.13.2
  - pytest=9.0.1
  # `snakemake --dag | dot` regenerates the pipeline figure, so graphviz is a
  # pipeline dependency rather than a developer convenience.
  - graphviz
  - python-graphviz
  - pip
  - pip:
      # TM-align bindings; module 2's superposition step only.
      - tmtools==0.3.0
