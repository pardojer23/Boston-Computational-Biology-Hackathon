# Pipeline configuration — the single source of every family-specific value and
# every parameter that changes an output.
#
# This file is a hashed DAG input: `pipeline/config.py` computes a stable digest
# over it, the digest is written into `results/run_manifest.json`, and any rule
# whose params derive from a changed section re-runs. Editing a value here and
# re-running only a downstream stage is therefore detected, which is the failure
# mode described in docs/PIPELINE_AUDIT.md finding 1.
#
# Values committed here reproduce the results in results/ bit-for-bit. Every
# number was taken from the four module manifests of the run at commit a2dfe7e,
# not re-derived.

schema_version: 1

# --------------------------------------------------------------------------- #
# The family under study. Nothing outside this block names a gene.
# --------------------------------------------------------------------------- #
family:
  name: leghemoglobin
  slug: globin

  species:
    name: Glycine max
    common: soybean
    ncbi_taxon: 3847

  # The ingroup: pairs with both members here are scored as focal-focal.
  # Everything else discovered by the HMM search is an outgroup. Promoting
  # GmLb5 (Glyma.10G198900) to a fifth focal gene is a one-line change here —
  # see NEXT_RUN.md §2.1 for the argument and the caveat (lowest pLDDT in the
  # set, and the only AFDB model whose length differs from the a4 transcript).
  focal_genes:
    Glyma.10G199100: Lba
    Glyma.10G199000: Lbc1
    Glyma.20G191200: Lbc2
    Glyma.10G198800: Lbc3

  # Symbols for members the HMM search finds that are not focal. A member with
  # no entry here is labelled by bare gene ID. Resolved against UniProt in
  # module 2; see README §2.1.
  outgroup_symbols:
    Glyma.10G198900: GmLb5   # LGB5_SOYBN, A0A0R0HW51 — leghemoglobin 5
    Glyma.11G121700: Hb1     # NSHB1_SOYBN, I1LJI1 — anaerobic nitrite reductase
    Glyma.11G121800: Hb2     # NSHB2_SOYBN, Q42785 — anaerobic nitrite reductase

  # Identifier conventions for this assembly. `id_prefix_strip` is removed from
  # protein IDs and `gff_seqid_strip` from GFF3 seqids to recover the bare gene
  # ID used as the join key everywhere.
  identifiers:
    id_prefix_strip: '^glyma\.Wm82\.gnm4\.ann1\.'
    gff_seqid_strip: '^glyma\.Wm82\.gnm4\.'
    chromosome_regex: 'Gm(\d+)$'
    # GSE226149's features.tsv.gz writes GLYMA_10G199100, not Glyma.10G199100.
    # Any lookup against that atlas goes through this transform or silently
    # matches nothing (README §9.16).
    geo_id_transform: upper_underscore

# --------------------------------------------------------------------------- #
# Stage 0 — reference data
# --------------------------------------------------------------------------- #
reference:
  # Phytozome requires a JGI login; SoyBase serves the identical Wm82.a4.v1
  # annotation under its own release name (README §1.1).
  assembly_annotation: Wm82.gnm4.ann1.T8TQ
  assembly_alias: Phytozome Wm82.a4.v1
  base_url: https://data.soybase.org/Glycine/max/annotations/Wm82.gnm4.ann1.T8TQ

  # sha256 is verified on every run and a mismatch fails the rule: SoyBase
  # re-releases under the same URL, so presence-based caching is not enough.
  files:
    proteome:
      url: https://data.soybase.org/Glycine/max/annotations/Wm82.gnm4.ann1.T8TQ/glyma.Wm82.gnm4.ann1.T8TQ.protein_primary.faa.gz
      local: data/reference/proteins_primary.faa.gz
      sha256: 603603800a4b1966868214159e892c44655c69ffc690f676732ed1c204c8447a
      n_sequences_expected: 52872
    gff3:
      url: https://data.soybase.org/Glycine/max/annotations/Wm82.gnm4.ann1.T8TQ/glyma.Wm82.gnm4.ann1.T8TQ.gene_models_exons.gff3.gz
      local: data/reference/gene_models_exons.gff3.gz
      sha256: d18e497767e4eaf5020993e2eb18b24839d7fafe832f6960a9b9a93b977f0d93

# --------------------------------------------------------------------------- #
# Stage 1 — sequence
# --------------------------------------------------------------------------- #
sequence:
  hmm:
    accession: PF00042
    name: Globin
    # InterPro resolves this to a specific Pfam release; the release actually
    # served is recorded in the run manifest and compared to `release_expected`.
    url: https://www.ebi.ac.uk/interpro/wwwapi//entry/pfam/PF00042?annotation=hmm
    local: data/reference/PF00042.hmm
    sha256: 7b300a21130b823627b09dd11fc5a76a7ca49515504c33493d140bcdeda93db3
    release_expected: PF00042.29
    model_length_expected: 117
    gathering_threshold_expected: 22
    # PF00042 excludes class-3 truncated haemoglobins, which match PF01152.
    # Adding a deeper outgroup means adding an accession here (README §1.2).
    excludes_note: class-3 truncated haemoglobins match PF01152, not PF00042

  select:
    threshold: cut_ga          # cut_ga | evalue
    evalue: null               # used only when threshold == evalue
    # Belt-and-braces: focal genes are unioned in even if they fall below the
    # cutoff. None of the four needed rescuing in the committed run.
    rescue_focal_below_cutoff: true

  # The relaxed search that establishes the family is not truncated at the GA
  # cutoff. Was run by hand for README §1.2 and is now a recorded check: the
  # 8th-best protein in the genome must sit at least `min_bitscore_gap` below
  # the weakest accepted hit.
  cutoff_check:
    enabled: true
    relaxed_evalue: 10
    min_bitscore_gap: 25.0
    policy: fail               # fail | warn

  alignment:
    program: mafft
    mode: linsi                # L-INS-i
    args: ['--localpair', '--maxiterate', '1000']
    n_columns_expected: 162

  # Terminal branch of the DAG: nothing downstream of the tree feeds the score.
  # Kept because the topology and its support are reported, not because any
  # score term depends on it. Internal Lb support is 31-47 (README §1.3).
  phylogeny:
    program: iqtree
    model: MFP                 # ModelFinder
    ufboot: 1000
    alrt: 1000
    seed: 20240601
    best_model_expected: Q.PLANT+I
    feeds_score: false

  identity:
    # Percent identity over MSA columns where both sequences have a residue,
    # computed from the alignment so it is consistent with the tree.
    source: alignment
    primary_metric: pid_aligned
    also_emit: [pid_shorter]

  embedding:
    model: facebook/esm2_t33_650M_UR50D
    layer: last
    pooling: residue_mean      # BOS/EOS/PAD masked before averaging
    batch_size: 8
    embedding_dim_expected: 1280
    # The committed matrix is fp32 on CPU. A GPU run uses fp16 and differs in
    # the fourth decimal; that is a provenance difference, not a scientific one
    # (README §1.5, §5.2). Set to float16 only together with a GPU rule.
    dtype: float32
    device: cpu

  duplication:
    # From GFF3 gene order alone — an adjacency statement, not synteny. Kept as
    # an annotation column and deliberately not a score term (README §4.5).
    tandem_max_intervening_genes: 10
    proximal_max_bp: 1000000
    is_score_term: false

# --------------------------------------------------------------------------- #
# Stage 2 — structure
# --------------------------------------------------------------------------- #
structure:
  source: alphafold_db         # no prediction is run and no GPU is used

  uniprot:
    search_api: https://rest.uniprot.org/uniprotkb/search
    entry_api: https://rest.uniprot.org/uniprotkb/{acc}.json
    # Resolution is cached to results/structure_module/uniprot_accessions.csv
    # with the release stamped on it. `pinned` overrides live resolution
    # entirely — set it to freeze the mapping against a UniProt release change,
    # which is the least stable input in the pipeline.
    pinned: null
    # pinned:
    #   Glyma.10G199100: P02238
    #   Glyma.10G199000: P02235
    #   Glyma.20G191200: P02236
    #   Glyma.10G198800: P02237
    #   Glyma.10G198900: A0A0R0HW51
    #   Glyma.11G121700: I1LJI1
    #   Glyma.11G121800: Q42785
    require_reviewed: false
    fail_on_missing: true

  afdb:
    api: https://alphafold.ebi.ac.uk/api/prediction/{acc}
    # The older AF-<acc>-F1-model_v4.pdb file URL no longer resolves; go through
    # the API and use the URL it returns (README §2.1).
    cache_dir: work/structure/afdb
    # The committed numbers are model_v6 (created 2025-08-01). A v7 release
    # would change TM-scores silently, so the version is checked.
    model_version_expected: 6
    model_version_policy: warn   # fail | warn

  # AFDB models are keyed on the UniProt sequence, which is not always the
  # Wm82.a4 primary transcript. Six of seven are byte-identical; GmLb5 is
  # +17 aa at 100% identity over the 151 aligned columns (README §2.1).
  model_vs_reference:
    min_identity: 99.0
    max_len_delta: 20
    policy: warn                 # fail | warn
    known_exceptions:
      Glyma.10G198900: 'UniProt sequence is 168 aa vs 151 aa for the a4 primary transcript; 100% identical over the aligned columns, and the lowest pLDDT in the set (81.6)'

  pocket:
    # AFDB models are apo, so the pocket is transferred from a heme-bound
    # crystal structure through the module 1 alignment.
    template_pdb: 1BIN           # soybean leghemoglobin-a, 2.20 A
    template_api: https://files.rcsb.org/download/{pdb_id}.pdb
    ligand: HEM
    cutoff_a: 5.0
    # Which family member the crystal numbering is transferred through. This
    # was `endswith('_Lba')` in the code — the hardcode that made the module
    # family-specific (audit 2.4b).
    reference_member: Lba
    n_residues_expected: 23
    cache_dir: work/structure/templates
    fail_on_unmappable: true

  # Independent check: UniProt's own heme-binding annotations for the reference
  # member must mostly fall inside the crystal-derived pocket. 4 of 5 in the
  # committed run. The annotations are a check on the transfer, not its source.
  pocket_crosscheck:
    enabled: true
    min_sites_inside: 4
    policy: warn                 # fail | warn

  superposition:
    program: tmtools             # TM-align
    # Normalised by the shorter chain: the conservative choice, since it cannot
    # be inflated by one protein being a fragment of the other.
    tm_normalisation: shorter_chain
    also_emit: [tm_norm_a, tm_norm_b, rmsd]

# --------------------------------------------------------------------------- #
# Stage 3 — expression
# --------------------------------------------------------------------------- #
expression:
  resolution: pseudobulk         # pseudobulk | cell_type

  series:
    accession: GSE226149
    note: mature nodule + root, protoplast scRNA-seq, used as pseudobulk
    ftp_base: https://ftp.ncbi.nlm.nih.gov/geo/samples/{dir}/{gsm}/suppl
    parts: [matrix.mtx.gz, features.tsv.gz, barcodes.tsv.gz]
    datadir: data/expression

  # Rejected with a measurement, not a preference: nuclear RNA is depleted of
  # abundant stable cytoplasmic transcripts and leghemoglobin is the extreme
  # case. Kept here so the rejection travels with the config (README §3.1,
  # NEXT_RUN.md §3).
  rejected_series:
    accession: GSE270392
    reason: 'snRNA-seq of early nodule; Lba ranks 45,386/52,594 with 668 counts against a median gene total of 2,496; 9-33 co-detected nuclei per Lb pair; the intended negative control Hb2 is the most abundant globin present'
    still_valid_for: qualitative confirmation that Lb transcript localises to infected cells

  libraries:
    - {gsm: GSM7065810, stem: Nodule_sample1, tissue: nodule, total_counts_expected: 47501352}
    - {gsm: GSM7065811, stem: Nodule_sample2, tissue: nodule, total_counts_expected: 48565100}
    - {gsm: GSM7065807, stem: Root_sample1,   tissue: root,   total_counts_expected: 14665336}
    - {gsm: GSM7065808, stem: Root_sample2,   tissue: root,   total_counts_expected: 20727649}
    - {gsm: GSM7065809, stem: Root_sample3,   tissue: root,   total_counts_expected: 31599717}

  # Tissue roles, so no downstream step has to name 'nodule' or 'root'.
  # `focal` is the tissue the dose ratio is computed in.
  tissues:
    focal: nodule
    contrast: root

  pseudobulk:
    # Counts summed over every barcode in a library; no cell calling. The cache
    # is keyed on the checksums of the five input matrices, not on the library
    # list, so replacing a file invalidates it (audit 3.2).
    cache: work/expression/pseudobulk_counts.csv.gz
    normalisation: cpm
    method: sum_over_barcodes

  # Independent cell-type markers, reported as context for the profiles and
  # deliberately not used to define them. Leghemoglobin is excluded on purpose:
  # using Lb to mark the infected-cell compartment would be circular here.
  markers:
    Glyma.08G120100:
      role: NOD26 — symbiosome membrane, infected cells
      uniprot: P08995
    Glyma.10G121524:
      role: Uricase-2 / nodulin-35 — uninfected interstitial cells
      uniprot: P04670
      # Absent from the GSE226149 feature list; returns in_matrix=False. A
      # substitute is needed before the cell-type work in README §5.1, not
      # after (audit 3.5).
      known_absent_from_series: GSE226149
    Glyma.20G072400:
      role: Uricase-2 isozyme 2
      uniprot: P04104
    Glyma.13G114000:
      role: Sucrose synthase / nodulin-100
      uniprot: P13708

  metrics:
    log2fc_pseudocount_cpm: 1.0
    log2fc_orientation: a over b, in the canonical label_a/label_b order
    # Emitted and known-degenerate: exactly 1.000 for all six focal pairs
    # because they share one zero/nonzero pattern across the three root
    # libraries. Not a property of nodule-exclusive genes in general — GmLb5's
    # pairs give 0.803 (README §3.3). Flagged in the table schema so a reader
    # does not have to find §9.10.
    degenerate_columns:
      spearman_profile: '1.000 for all six focal pairs over 5 points; carries no information at this resolution'
    # Per-cell quantities; pseudobulk has no cells. Emitted as NA with this
    # reason string rather than replaced by a look-alike statistic.
    not_computable:
      detection_rate: per-cell quantity; pseudobulk has no cells
      coexpression_overlap: per-cell quantity; pseudobulk has no cells
    tau_caveat: two tissue types only; tau collapses to a focal-vs-contrast contrast

  # The comparison behind the series rejection. Had no committed runner
  # (README §9.7) — now a real rule.
  dataset_diagnostic:
    enabled: true
    # Panel b compares transcript share against published protein share. Set
    # `published_protein_shares` to null to drop the panel rather than plot
    # uncited numbers.
    published_protein_shares: null
    published_protein_source: null

# --------------------------------------------------------------------------- #
# Stage 4 — integration and the redundancy score
# --------------------------------------------------------------------------- #
score:
  # Gated, not additive: two genes that are 95% identical but never expressed
  # in the same place are not functionally redundant, because neither can
  # buffer the other's loss. A product cannot award such a pair a high value on
  # sequence alone (README §4.1).
  form: R = M**alpha * E**beta
  alpha_m: 0.40
  # beta is 1 - alpha_m, never set independently.

  # Three sub-axes rather than four flat features: the four raw molecular
  # features are collinear across all 21 pairs (Spearman 0.85-0.94), so
  # averaging them as equals would count sequence twice. Within the six focal
  # pairs identity and pocket identity come apart (rho = 0.39), which is where
  # the question lives.
  m_axes:
    seq: 0.3333333333333333     # mean of normalised pid_aligned and ESM2 similarity
    fold: 0.3333333333333333    # normalised TM-score
    pocket: 0.3333333333333333  # normalised pocket identity over the mapped residues

  e_terms:
    tissue_overlap: histogram intersection of normalised tissue-mean CPM profiles
    dose: dose_ratio            # smaller focal-tissue mean CPM over larger

  normalisation:
    molecular_scope: family     # min-max over all pairs, so M is one absolute scale
    scopes_emitted: [family, clade]
    # A plain min-max zero in either factor would zero the product and merge
    # pairs that differ. The floor is a presentation choice on a relative
    # score and changes no ordering (README §9.19).
    clade_floor: 0.05

  weight_sweep:
    alpha_min: 0.0
    alpha_max: 1.0
    steps: 21

  # Deliberately excluded, with the reason carried into the manifest.
  metrics_not_used:
    spearman_profile: 1.000 for all six focal pairs; carries no information
    coexpression_overlap: NA upstream — per-cell quantity, pseudobulk has no cells
    duplication_mode: reported as an interpretive column, deliberately not a score term

# --------------------------------------------------------------------------- #
# Validation policy. Every check below is evaluated with its evidence recorded;
# `policy` decides whether a failure stops the run. Previously all of these
# were printed and the runner exited 0 regardless (audit 4.5).
# --------------------------------------------------------------------------- #
checks:
  reference_checksums:            {policy: fail}
  hmm_release:                    {policy: warn}
  family_cutoff_gap:              {policy: fail}
  alignment_columns:              {policy: warn}
  afdb_model_version:             {policy: warn}
  model_vs_reference_sequence:    {policy: warn}
  pocket_residue_count:           {policy: fail}
  pocket_uniprot_crosscheck:      {policy: warn}
  library_total_counts:           {policy: warn}
  pair_table_contracts:           {policy: fail}
  pair_join_completeness:         {policy: fail}
  focal_outgroup_separation:      {policy: fail}
  directional_coverage_abundance: {policy: fail}
  # Reported, never asserted: the top two focal pairs are 0.011 apart and swap
  # at alpha ~ 0.52, so the identity of the single most redundant pair is
  # unresolved (README §4.4, §9.18).
  symmetric_ranking_top:          {policy: report}

# --------------------------------------------------------------------------- #
# Layout. Rules take these as roots; no library module resolves a path from
# __file__ (audit finding 3).
# --------------------------------------------------------------------------- #
paths:
  data: data
  work: work
  results: results
  sequence_out: results/sequence_module
  structure_out: results/structure_module
  expression_out: results/expression_module
  integration_out: results/integration_module
  run_manifest: results/run_manifest.json

resources:
  threads_default: 4
  hmmsearch_threads: 8
  mafft_threads: 4
  iqtree_threads: 4
